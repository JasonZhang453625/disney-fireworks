<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disney Magic Kingdom Fireworks · 3D Immersive Experience</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="viewport">
    <!-- 3D Sky, Deep Space & Nebulae -->
    <div class="sky-bg"></div>
    <div class="nebula-glow"></div>
    <div class="stars-layer-1"></div>
    <div class="stars-layer-2"></div>
    <div class="mountains-bg"></div>

    <!-- 3D Volumetric Spotlights -->
    <div class="searchlights-rig" id="searchlights">
      <div class="spotlight-beam beam-left-1"></div>
      <div class="spotlight-beam beam-left-2"></div>
      <div class="spotlight-beam beam-right-1"></div>
      <div class="spotlight-beam beam-right-2"></div>
    </div>

    <!-- 3D Fireworks Particle Canvas -->
    <div id="canvas-container">
      <canvas id="fireworks-canvas"></canvas>
    </div>

    <!-- Atmospheric Mist Layer -->
    <div class="mist-layer"></div>

    <!-- Exquisitely Detailed Disney Fairytale Castle Silhouette -->
    <div id="castle-wrapper">
      <div class="castle-container">
        <svg class="castle-svg" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Wall Gradients with 3D Lighting -->
            <linearGradient id="mainWallGrad" x1="600" y1="80" x2="600" y2="680" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#141938" />
              <stop offset="35%" stop-color="#0c1126" />
              <stop offset="70%" stop-color="#070a18" />
              <stop offset="100%" stop-color="#02040a" />
            </linearGradient>

            <linearGradient id="roofSpiresGrad" x1="600" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#283a70" />
              <stop offset="50%" stop-color="#182448" />
              <stop offset="100%" stop-color="#0d1428" />
            </linearGradient>

            <linearGradient id="goldTrimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFEAA7" />
              <stop offset="50%" stop-color="#FFD700" />
              <stop offset="100%" stop-color="#E17055" />
            </linearGradient>

            <radialGradient id="clockRoseGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFF8DB" />
              <stop offset="40%" stop-color="#FFD700" />
              <stop offset="85%" stop-color="#FF9F43" />
              <stop offset="100%" stop-color="rgba(255,159,67,0)" />
            </radialGradient>

            <!-- Warm Window Glow Filter -->
            <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <filter id="megaGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="8" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Flying Buttresses / Side Arches -->
          <path d="M 280 500 C 230 460 210 380 200 350 L 220 350 C 230 380 250 450 300 490 Z" fill="url(#mainWallGrad)" />
          <path d="M 920 500 C 970 460 990 380 1000 350 L 980 350 C 970 380 950 450 900 490 Z" fill="url(#mainWallGrad)" />

          <!-- Main Bastion & Base Curtain Walls -->
          <rect x="240" y="470" width="720" height="210" fill="url(#mainWallGrad)" />
          <rect x="320" y="380" width="560" height="110" fill="url(#mainWallGrad)" />
          <rect x="420" y="270" width="360" height="130" fill="url(#mainWallGrad)" />

          <!-- Crenellations / Stone Battlements -->
          <path d="M 240 470 h 720 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 h -24 v -18 h -16 v 18 Z" fill="url(#mainWallGrad)" />
          <path d="M 320 380 h 560 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 h -20 v -16 h -14 v 16 Z" fill="url(#mainWallGrad)" />

          <!-- Level 1 Outer Spires (Far Wings) -->
          <rect x="180" y="420" width="65" height="260" fill="url(#mainWallGrad)" />
          <polygon points="170,420 212,280 255,420" fill="url(#roofSpiresGrad)" />
          <line x1="212" y1="280" x2="212" y2="245" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <polygon points="212,245 228,253 212,262" fill="url(#goldTrimGrad)" />
          <circle cx="212" cy="245" r="3" fill="#FFF" filter="url(#softGlow)" />

          <rect x="955" y="420" width="65" height="260" fill="url(#mainWallGrad)" />
          <polygon points="945,420 987,280 1030,420" fill="url(#roofSpiresGrad)" />
          <line x1="987" y1="280" x2="987" y2="245" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <polygon points="987,245 1003,253 987,262" fill="url(#goldTrimGrad)" />
          <circle cx="987" cy="245" r="3" fill="#FFF" filter="url(#softGlow)" />

          <!-- Level 2 Mid Towers -->
          <rect x="290" y="320" width="70" height="220" fill="url(#mainWallGrad)" />
          <polygon points="278,320 325,180 372,320" fill="url(#roofSpiresGrad)" />
          <line x1="325" y1="180" x2="325" y2="150" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <polygon points="325,150 340,158 325,166" fill="url(#goldTrimGrad)" />
          <circle cx="325" cy="150" r="3.5" fill="#FFF" filter="url(#softGlow)" />

          <rect x="840" y="320" width="70" height="220" fill="url(#mainWallGrad)" />
          <polygon points="828,320 875,180 922,320" fill="url(#roofSpiresGrad)" />
          <line x1="875" y1="180" x2="875" y2="150" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <polygon points="875,150 890,158 875,166" fill="url(#goldTrimGrad)" />
          <circle cx="875" cy="150" r="3.5" fill="#FFF" filter="url(#softGlow)" />

          <!-- Level 3 Inner Flanking Spires -->
          <rect x="390" y="220" width="55" height="190" fill="url(#mainWallGrad)" />
          <polygon points="380,220 417,90 455,220" fill="url(#roofSpiresGrad)" />
          <line x1="417" y1="90" x2="417" y2="62" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <polygon points="417,62 432,70 417,78" fill="url(#goldTrimGrad)" />
          <circle cx="417" cy="62" r="3" fill="#FFF" filter="url(#softGlow)" />

          <rect x="755" y="220" width="55" height="190" fill="url(#mainWallGrad)" />
          <polygon points="745,220 782,90 820,220" fill="url(#roofSpiresGrad)" />
          <line x1="782" y1="90" x2="782" y2="62" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <polygon points="782,62 797,70 782,78" fill="url(#goldTrimGrad)" />
          <circle cx="782" cy="62" r="3" fill="#FFF" filter="url(#softGlow)" />

          <!-- Grand Center Clock Tower & Spire Apex -->
          <rect x="520" y="150" width="160" height="280" fill="url(#mainWallGrad)" />
          <polygon points="495,150 600,10 705,150" fill="url(#roofSpiresGrad)" />
          
          <!-- Tower Spire Pinnacle & Magical Star -->
          <line x1="600" y1="10" x2="600" y2="-30" stroke="url(#goldTrimGrad)" stroke-width="3.5" />
          <polygon points="600,-30 622,-18 600,-6" fill="url(#goldTrimGrad)" />
          <circle cx="600" cy="-30" r="5.5" fill="#FFFFFF" filter="url(#megaGlow)" />

          <!-- Arched Grand Castle Portal -->
          <path d="M 545 680 v -105 a 55 55 0 0 1 110 0 v 105 Z" fill="#03050c" stroke="rgba(255,215,0,0.5)" stroke-width="2.5" />
          <path d="M 560 680 v -85 a 40 40 0 0 1 80 0 v 85 Z" fill="#ffd700" opacity="0.18" filter="url(#softGlow)" />

          <!-- Majestic Rose Window / Clock Facet -->
          <circle cx="600" cy="225" r="32" fill="#141d3b" stroke="url(#goldTrimGrad)" stroke-width="2.5" />
          <circle cx="600" cy="225" r="25" fill="url(#clockRoseGlow)" filter="url(#softGlow)" opacity="0.9" />
          <circle cx="600" cy="225" r="10" fill="#FFFFFF" />

          <!-- Glowing Arched Castle Windows with Atmospheric Light -->
          <!-- Upper Spires -->
          <path d="M 575 305 v -25 a 12 12 0 0 1 24 0 v 25 Z" fill="#FFEAA7" filter="url(#softGlow)" opacity="0.95" />
          <path d="M 605 305 v -25 a 12 12 0 0 1 24 0 v 25 Z" fill="#FFEAA7" filter="url(#softGlow)" opacity="0.95" />

          <!-- Mid Spires Windows -->
          <path d="M 405 285 v -20 a 10 10 0 0 1 20 0 v 20 Z" fill="#FFD700" filter="url(#softGlow)" opacity="0.9" />
          <path d="M 770 285 v -20 a 10 10 0 0 1 20 0 v 20 Z" fill="#FFD700" filter="url(#softGlow)" opacity="0.9" />

          <!-- Outer Spire Windows -->
          <path d="M 315 390 v -22 a 10 10 0 0 1 20 0 v 22 Z" fill="#FFEAA7" filter="url(#softGlow)" opacity="0.88" />
          <path d="M 865 390 v -22 a 10 10 0 0 1 20 0 v 22 Z" fill="#FFEAA7" filter="url(#softGlow)" opacity="0.88" />

          <!-- Wing Windows -->
          <path d="M 202 485 v -18 a 8 8 0 0 1 16 0 v 18 Z" fill="#FFD700" filter="url(#softGlow)" opacity="0.85" />
          <path d="M 977 485 v -18 a 8 8 0 0 1 16 0 v 18 Z" fill="#FFD700" filter="url(#softGlow)" opacity="0.85" />

          <!-- Perimeter Fairy Light Garland along roof ridges -->
          <g filter="url(#softGlow)">
            <!-- Center Main Spire -->
            <circle cx="495" cy="150" r="2.0" fill="#FFF" />
            <circle cx="530" cy="103" r="2.0" fill="#FFD700" />
            <circle cx="565" cy="56" r="2.2" fill="#FFF" />
            <circle cx="600" cy="10" r="3.2" fill="#FFF" />
            <circle cx="635" cy="56" r="2.2" fill="#FFF" />
            <circle cx="670" cy="103" r="2.0" fill="#FFD700" />
            <circle cx="705" cy="150" r="2.0" fill="#FFF" />

            <!-- Left Tower Roof -->
            <circle cx="380" cy="220" r="1.8" fill="#FFF" />
            <circle cx="398" cy="155" r="1.8" fill="#FFD700" />
            <circle cx="417" cy="90" r="2.5" fill="#FFF" />
            <circle cx="436" cy="155" r="1.8" fill="#FFD700" />
            <circle cx="455" cy="220" r="1.8" fill="#FFF" />

            <!-- Right Tower Roof -->
            <circle cx="745" cy="220" r="1.8" fill="#FFF" />
            <circle cx="763" cy="155" r="1.8" fill="#FFD700" />
            <circle cx="782" cy="90" r="2.5" fill="#FFF" />
            <circle cx="801" cy="155" r="1.8" fill="#FFD700" />
            <circle cx="820" cy="220" r="1.8" fill="#FFF" />
          </g>
        </svg>
      </div>
    </div>

    <!-- 3D Lake Water & Dynamic Shimmering Reflection Plane -->
    <div class="water-reflection-plane">
      <div class="water-ripple-mesh"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/fireworks.js"></script>
  <script src="js/show.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('fireworks-canvas');
      const engine = new FireworksEngine(canvas);
      const controller = new ShowController(engine);

      // Auto-start immediately
      controller.start();

      // Unlock audio on first user touch/click/keypress
      const unlockAudio = () => {
        if (window.soundEngine) {
          window.soundEngine.init();
          window.soundEngine.resume();
        }
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
      };

      window.addEventListener('click', unlockAudio, { once: true });
      window.addEventListener('touchstart', unlockAudio, { once: true });
      window.addEventListener('keydown', unlockAudio, { once: true });
    });
  </script>
</body>
</html>
